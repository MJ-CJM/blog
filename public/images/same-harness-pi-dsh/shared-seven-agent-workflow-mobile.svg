<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600" role="img" aria-labelledby="title desc">
  <title id="title">同一 saved workflow，比较控制权，不比较模型效果，手机版</title>
  <desc id="desc">纵向实验设计图。先列出固定的 saved workflow 脚本字节、正常成功路径下的三到三到一拓扑、Agent labels，以及 Review 至少成功两条和 Challenge 至少成功两条的基础计数门槛，再显示三评审、三挑战和一次综合。失败降级时 Challenge 数可以是两条，因此三到三到一仅代表正常成功路径。随后列出 DSH 插件与 Pi Extension 的实际运行时、模型路由和结果契约；DSH 额外要求至少两条成功实际路由，Pi 的路线多样性门槛为一，因此不构成多模型证明。底部说明只比较运行时所有权、生命周期、失败语义和证据落点，不比较模型质量、性能和成本。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker><marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker>
    <filter id="shadow" x="-12%" y="-16%" width="124%" height="145%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#172033" flood-opacity="0.09"/></filter>
    <style>.font{font-family:Inter,'Noto Sans SC','PingFang SC',system-ui,sans-serif}.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}.ink{fill:#172033}.muted{fill:#526079}.white{fill:#FFFFFF}.line{fill:none;stroke-linecap:round;stroke-linejoin:round}.label{font-size:18px;font-weight:760;letter-spacing:.05em}.body{font-size:21px}.small{font-size:17px}</style>
  </defs>
  <rect width="900" height="1600" fill="#F7F9FC"/>
  <g class="font ink">
    <text x="450" y="54" text-anchor="middle" font-size="39" font-weight="790">同一 saved workflow</text><text x="450" y="101" text-anchor="middle" font-size="39" font-weight="790">比较控制权，不比较模型效果</text><text x="450" y="140" text-anchor="middle" font-size="21" class="muted">固定脚本与流程结构，观察插件接管哪一层</text>
    <g filter="url(#shadow)">
      <rect x="45" y="170" width="810" height="238" rx="26" fill="#FFFFFF" stroke="#D9E1EE" stroke-width="2"/><rect x="45" y="170" width="810" height="54" rx="26" fill="#172033"/><path d="M45 198h810v26H45z" fill="#172033"/><text x="75" y="206" class="label white">固定变量 · CONTROLLED</text><text x="825" y="206" text-anchor="end" class="small white" opacity=".75">两端保持一致</text>
      <rect x="70" y="248" width="362" height="62" rx="16" fill="#EAF1FF"/><circle cx="102" cy="279" r="17" fill="#2563EB"/><text x="102" y="286" text-anchor="middle" font-size="16" font-weight="800" class="white">1</text><text x="132" y="273" class="small" font-weight="720" fill="#1D4ED8">脚本输入</text><text x="132" y="298" class="body" font-weight="760">字节一致</text>
      <rect x="468" y="248" width="362" height="62" rx="16" fill="#F1ECFE"/><circle cx="500" cy="279" r="17" fill="#7C3AED"/><text x="500" y="286" text-anchor="middle" font-size="16" font-weight="800" class="white">2</text><text x="530" y="273" class="small" font-weight="720" fill="#5B21B6">正常路径拓扑</text><text x="530" y="299" class="body mono" font-weight="790">3 → 3 → 1</text>
      <rect x="70" y="324" width="362" height="62" rx="16" fill="#E5F6F9"/><circle cx="102" cy="355" r="17" fill="#0E7490"/><text x="102" y="362" text-anchor="middle" font-size="16" font-weight="800" class="white">3</text><text x="132" y="349" class="small" font-weight="720" fill="#0E6078">任务身份</text><text x="132" y="374" class="body" font-weight="760">Agent labels 一致</text>
      <rect x="468" y="324" width="362" height="62" rx="16" fill="#FFF0D5"/><circle cx="500" cy="355" r="17" fill="#D97706"/><text x="500" y="362" text-anchor="middle" font-size="16" font-weight="800" class="white">4</text><text x="530" y="349" class="small" font-weight="720" fill="#9A4C05">基础成功计数一致</text><text x="530" y="374" font-size="17" font-weight="760">Review ≥ 2 · Challenge ≥ 2</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="45" y="435" width="810" height="392" rx="26" fill="#FFFFFF" stroke="#D9E1EE" stroke-width="2"/><text x="75" y="472" class="label" fill="#526079">共同输入 · SAME SAVED WORKFLOW</text><text x="75" y="508" class="small" font-weight="760" fill="#5B21B6">PHASE 1 · 3 INDEPENDENT REVIEWS</text>
      <rect x="75" y="526" width="226" height="66" rx="16" fill="#F5F2FE" stroke="#CFC1F5" stroke-width="2"/><circle cx="104" cy="559" r="16" fill="#7C3AED"/><text x="104" y="565" text-anchor="middle" font-size="15" font-weight="800" class="white">1</text><text x="132" y="557" font-size="18" font-weight="760" fill="#5B21B6">fast</text><text x="132" y="578" font-size="15" class="muted">review</text>
      <rect x="337" y="526" width="226" height="66" rx="16" fill="#F5F2FE" stroke="#CFC1F5" stroke-width="2"/><circle cx="366" cy="559" r="16" fill="#7C3AED"/><text x="366" y="565" text-anchor="middle" font-size="15" font-weight="800" class="white">2</text><text x="394" y="557" font-size="18" font-weight="760" fill="#5B21B6">deep</text><text x="394" y="578" font-size="15" class="muted">review</text>
      <rect x="599" y="526" width="226" height="66" rx="16" fill="#F5F2FE" stroke="#CFC1F5" stroke-width="2"/><circle cx="628" cy="559" r="16" fill="#7C3AED"/><text x="628" y="565" text-anchor="middle" font-size="15" font-weight="800" class="white">3</text><text x="656" y="557" font-size="18" font-weight="760" fill="#5B21B6">review</text><text x="656" y="578" font-size="15" class="muted">review</text>
      <path d="M188 592v50M450 592v50M712 592v50" stroke="#2563EB" stroke-width="4" class="line" marker-end="url(#arrow-blue)"/><text x="75" y="630" class="small" font-weight="760" fill="#0E6078">PHASE 2 · 3 CHALLENGES</text>
      <rect x="75" y="650" width="226" height="66" rx="16" fill="#EAF7FA" stroke="#A7D8E3" stroke-width="2"/><circle cx="104" cy="683" r="16" fill="#0E7490"/><text x="104" y="689" text-anchor="middle" font-size="15" font-weight="800" class="white">4</text><text x="132" y="681" font-size="18" font-weight="760" fill="#0E6078">challenge</text><text x="132" y="702" font-size="15" class="muted">route 1</text>
      <rect x="337" y="650" width="226" height="66" rx="16" fill="#EAF7FA" stroke="#A7D8E3" stroke-width="2"/><circle cx="366" cy="683" r="16" fill="#0E7490"/><text x="366" y="689" text-anchor="middle" font-size="15" font-weight="800" class="white">5</text><text x="394" y="681" font-size="18" font-weight="760" fill="#0E6078">challenge</text><text x="394" y="702" font-size="15" class="muted">route 2</text>
      <rect x="599" y="650" width="226" height="66" rx="16" fill="#EAF7FA" stroke="#A7D8E3" stroke-width="2"/><circle cx="628" cy="683" r="16" fill="#0E7490"/><text x="628" y="689" text-anchor="middle" font-size="15" font-weight="800" class="white">6</text><text x="656" y="681" font-size="18" font-weight="760" fill="#0E6078">challenge</text><text x="656" y="702" font-size="15" class="muted">route 3</text>
      <path d="M188 716C188 756 322 748 389 766M450 716v50M712 716C712 756 578 748 511 766" stroke="#D97706" stroke-width="4" class="line" marker-end="url(#arrow-orange)"/><rect x="265" y="756" width="370" height="50" rx="17" fill="#FFF5E3" stroke="#F1C47D" stroke-width="2"/><circle cx="298" cy="781" r="17" fill="#D97706"/><text x="298" y="788" text-anchor="middle" font-size="16" font-weight="800" class="white">7</text><text x="331" y="778" font-size="19" font-weight="780" fill="#9A4C05">final synthesis</text><text x="331" y="798" font-size="15" class="muted">共识 · 分歧 · 最终结果</text>
    </g>
    <text x="450" y="865" text-anchor="middle" class="label" fill="#526079">两端实际执行配置 · OBSERVED</text>
    <g filter="url(#shadow)">
      <rect x="45" y="888" width="810" height="190" rx="24" fill="#FFFFFF" stroke="#B9E1EA" stroke-width="2"/><rect x="45" y="888" width="810" height="48" rx="24" fill="#0E7490"/><path d="M45 912h810v24H45z" fill="#0E7490"/><text x="73" y="920" font-size="22" font-weight="790" class="white">DSH 插件</text><text x="827" y="920" text-anchor="end" class="small white" opacity=".86">平台 runtime 执行</text>
      <line x1="315" y1="956" x2="315" y2="1052" stroke="#D9E1EE" stroke-width="2"/><line x1="585" y1="956" x2="585" y2="1052" stroke="#D9E1EE" stroke-width="2"/><text x="72" y="976" class="small" font-weight="760" fill="#0E6078">RUNTIME</text><text x="72" y="1005" class="body" font-weight="780">官方 WorkflowEngine</text><text x="72" y="1033" class="small muted">平台调度</text><text x="342" y="976" class="small" font-weight="760" fill="#0E6078">ROUTES</text><text x="342" y="1005" class="body" font-weight="780">V4 Flash + Pro</text><text x="342" y="1033" font-size="15" class="muted">额外门禁：成功路线 ≥ 2</text><text x="612" y="976" class="small" font-weight="760" fill="#0E6078">RESULT</text><text x="612" y="1005" class="body" font-weight="780">结构化校验</text><text x="612" y="1033" class="small muted">3 项 × 4 字段</text>
    </g>
    <g filter="url(#shadow)">
      <rect x="45" y="1100" width="810" height="190" rx="24" fill="#FFFFFF" stroke="#D8D0F5" stroke-width="2"/><rect x="45" y="1100" width="810" height="48" rx="24" fill="#7C3AED"/><path d="M45 1124h810v24H45z" fill="#7C3AED"/><text x="73" y="1132" font-size="22" font-weight="790" class="white">Pi Extension</text><text x="827" y="1132" text-anchor="end" class="small white" opacity=".86">扩展 runtime 执行</text>
      <line x1="315" y1="1168" x2="315" y2="1264" stroke="#D9E1EE" stroke-width="2"/><line x1="585" y1="1168" x2="585" y2="1264" stroke="#D9E1EE" stroke-width="2"/><text x="72" y="1188" class="small" font-weight="760" fill="#5B21B6">RUNTIME</text><text x="72" y="1217" class="body" font-weight="780">Extension-owned</text><text x="72" y="1245" class="small muted">自建 Workflow Runtime</text><text x="342" y="1188" class="small" font-weight="760" fill="#5B21B6">ROUTES</text><text x="342" y="1217" class="body" font-weight="780">GLM-5.2 × 3 档</text><text x="342" y="1245" font-size="15" class="muted">门槛 = 1；非多模型证明</text><text x="612" y="1188" class="small" font-weight="760" fill="#5B21B6">RESULT</text><text x="612" y="1217" class="body" font-weight="780">plain-text</text><text x="612" y="1245" class="small muted">Extension 持久化</text>
    </g>
    <rect x="45" y="1318" width="510" height="220" rx="22" fill="#172033"/><text x="73" y="1351" class="label white">可以比较 · 本文回答</text>
    <g font-size="19" font-weight="720"><rect x="73" y="1372" width="208" height="44" rx="22" fill="#FFFFFF" fill-opacity=".13"/><text x="177" y="1401" text-anchor="middle" class="white">运行时所有权</text><rect x="297" y="1372" width="208" height="44" rx="22" fill="#FFFFFF" fill-opacity=".13"/><text x="401" y="1401" text-anchor="middle" class="white">生命周期</text><rect x="73" y="1432" width="208" height="44" rx="22" fill="#FFFFFF" fill-opacity=".13"/><text x="177" y="1461" text-anchor="middle" class="white">失败语义</text><rect x="297" y="1432" width="208" height="44" rx="22" fill="#FFFFFF" fill-opacity=".13"/><text x="401" y="1461" text-anchor="middle" class="white">证据落点</text></g><path d="M459 1502l10 10 21-24" fill="none" stroke="#67E8F9" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="575" y="1318" width="280" height="220" rx="22" fill="#FFF0D5" stroke="#F1C47D" stroke-width="2"/><text x="603" y="1351" class="label" fill="#9A4C05">不能比较</text><text x="603" y="1385" class="small" font-weight="720" fill="#9A4C05">不做效果排名</text><circle cx="610" cy="1421" r="5" fill="#D97706"/><text x="628" y="1428" class="body" font-weight="720" fill="#9A4C05">模型质量</text><circle cx="610" cy="1464" r="5" fill="#D97706"/><text x="628" y="1471" class="body" font-weight="720" fill="#9A4C05">性能速度</text><circle cx="610" cy="1507" r="5" fill="#D97706"/><text x="628" y="1514" class="body" font-weight="720" fill="#9A4C05">调用成本</text>
    <text x="450" y="1574" text-anchor="middle" font-size="17" class="muted">结构复现实验 · 两端模型与结果契约不同</text>
  </g>
</svg>
