    <text x="495" y="558" text-anchor="middle" font-size="15" class="muted">agent outcomes · final result</text>
    <rect x="374" y="609" width="242" height="34" rx="17" fill="#F0EBFF"/>
    <text x="495" y="632" text-anchor="middle" font-size="15" font-weight="700" fill="#5B21B6">回传 Web 可展示的结构化报告</text>

