      <rect x="659" y="111" width="18" height="18" rx="5" fill="#0E7490"/><text x="687" y="126" fill="#0E7490">官方 DSH 运行时</text>
      <rect x="857" y="111" width="18" height="18" rx="5" fill="#D97706"/><text x="885" y="126" fill="#9A4C05">实验边界</text>
    </g>

