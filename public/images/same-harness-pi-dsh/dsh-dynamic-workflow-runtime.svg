<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DSH Dynamic Workflow 插件的真实实现结构</title>
  <desc id="desc">Web 或根 Agent 加载 profiled-dynamic-workflow Skill，并调用白名单中的 profiled_dynamic_workflow Tool。插件 Wrapper 解析 workflow 与 profile、验证结果契约并汇总 telemetry。随后在同一个 delegation isolate 内复用官方 WorkerThread WorkflowEngine 执行受信任的 saved workflow script。脚本的 agent 调用通过官方 Agent Registry 和 Subagent 机制创建子 Agent；fast 路由到 Flash，deep 与 review 路由到 Pro。当前实验 Profile 决定 AgentFactory 使用 Stock 官方 Loop、继承式 Adapter 或完全自写的 Full Custom Loop。插件拥有 Wrapper、契约和 telemetry，官方拥有 WorkflowEngine 与 Session、LLM、Tool Registry、Guard、Web、Subagent，以及 AbortSignal 和生命周期传播 seam。Full Custom 更换 Agent Loop 不等于更换 WorkflowEngine，并且需要自行实现 cancel、owner cleanup 和 dispose；Worker 和受信任脚本边界不是恶意代码安全沙箱。</desc>
