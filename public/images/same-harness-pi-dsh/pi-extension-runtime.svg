      <text x="1160" y="404" font-size="16" font-weight="700" fill="#526079">Pi JSON 子进程</text>
      <rect x="1160" y="416" width="328" height="37" rx="16" fill="#E9F8FC" stroke="#67C7DA"/><text x="1324" y="441" text-anchor="middle" font-size="18" font-weight="760" fill="#0E7490">官方 Pi Agent Loop</text>

      <rect x="1036" y="490" width="483" height="94" rx="20" fill="#F8FAFF" stroke="#67C7DA" stroke-width="2"/>
      <rect x="1055" y="509" width="76" height="36" rx="18" fill="#0E7490"/><text x="1093" y="534" text-anchor="middle" font-size="16" font-weight="760" fill="#FFFFFF">review</text>
      <text x="1160" y="520" font-size="16" font-weight="700" fill="#526079">Pi JSON 子进程</text>
      <rect x="1160" y="532" width="328" height="37" rx="16" fill="#E9F8FC" stroke="#67C7DA"/><text x="1324" y="557" text-anchor="middle" font-size="18" font-weight="760" fill="#0E7490">官方 Pi Agent Loop</text>
    </g>
    <rect x="1047" y="610" width="461" height="38" rx="19" fill="#FFF0D5"/>
    <text x="1277" y="636" text-anchor="middle" font-size="17" font-weight="700" fill="#9A4C05">profile 传入 provider · model · thinking</text>

    <rect x="45" y="704" width="1510" height="122" rx="26" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="2"/>
    <text x="75" y="737" font-size="20" font-weight="760" fill="#5B21B6">Extension 自己承担的运行时职责</text>
    <g text-anchor="middle" font-size="17" font-weight="700">
      <rect x="75" y="756" width="238" height="46" rx="16" fill="#F0EBFF" stroke="#BDA8F4"/><text x="194" y="785" fill="#5B21B6">并发调度与节点依赖</text>
      <rect x="329" y="756" width="285" height="46" rx="16" fill="#FFF0D5" stroke="#F1C77E"/><text x="471" y="785" fill="#9A4C05">idle / hard / run 三层 timeout</text>
      <rect x="630" y="756" width="229" height="46" rx="16" fill="#FFF0D5" stroke="#F1C77E"/><text x="744" y="785" fill="#9A4C05">SIGTERM → SIGKILL</text>
      <rect x="875" y="756" width="259" height="46" rx="16" fill="#EAF1FF" stroke="#9DB7EB"/><text x="1004" y="785" fill="#1D4ED8">state / events / result</text>
      <rect x="1150" y="756" width="375" height="46" rx="16" fill="#E9F8FC" stroke="#67C7DA"/><text x="1337" y="785" fill="#0E7490">TUI 进度 · Esc · 最终结果卡</text>
    </g>

    <g font-size="16" font-weight="700">
      <rect x="45" y="844" width="734" height="37" rx="18" fill="#FFF0D5" stroke="#F1C77E"/>
      <path d="M67 854l10 17H57z" fill="#D97706"/><text x="91" y="869" fill="#7C4A10">Worker + node:vm 只隔离运行，不是 hostile-code sandbox</text>
      <rect x="796" y="844" width="759" height="37" rx="18" fill="#FFF0D5" stroke="#F1C77E"/>
      <path d="M818 854l10 17H808z" fill="#D97706"/><text x="842" y="869" fill="#7C4A10">Dynamic v1：active run 不支持跨进程 resume / cancel</text>
    </g>
  </g>
</svg>
