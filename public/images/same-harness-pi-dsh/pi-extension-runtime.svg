<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Pi Dynamic Workflow 插件的真实实现结构</title>
  <desc id="desc">前台 dw-run 命令进入 Extension 自己实现的 DynamicWorkflowEngine。Engine 在 Worker 中用 node vm 解释受信任的 saved workflow script，脚本的 agent 调用为每个节点启动独立 Pi JSON 子进程；每个子进程继续使用官方 Pi Agent Loop，并通过 profile 接收 provider、model 与 thinking。Extension 负责并发、idle hard run 三层超时、SIGTERM 到 SIGKILL、state events result 持久化、前台 TUI 进度、Esc 取消与结果卡。Worker 和 node vm 不是恶意代码沙箱，Dynamic v1 的 active run 不支持跨进程 resume 或 cancel。</desc>
  <defs>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#7C3AED"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#526079"/></marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="6" stdDeviation="9" flood-color="#172033" flood-opacity="0.09"/></filter>
  </defs>
  <rect width="1600" height="900" fill="#F7F9FC"/>
  <g font-family="Inter, Noto Sans SC, PingFang SC, system-ui, sans-serif" fill="#172033">
    <text x="800" y="58" text-anchor="middle" font-size="42" font-weight="760">Pi Dynamic Workflow 插件：Extension 在官方 Agent Loop 外编排</text>
    <text x="800" y="99" text-anchor="middle" font-size="21" fill="#526079">前台命令 → 自建 Workflow Runtime → 独立子 Pi 进程；子进程仍复用官方 Pi Agent Loop</text>

    <g font-size="16" font-weight="700">
      <rect x="566" y="116" width="18" height="18" rx="5" fill="#7C3AED"/><text x="594" y="131" fill="#5B21B6">Extension-owned</text>
      <rect x="745" y="116" width="18" height="18" rx="5" fill="#0E7490"/><text x="773" y="131" fill="#0E7490">官方 Pi 复用</text>
      <rect x="899" y="116" width="18" height="18" rx="5" fill="#D97706"/><text x="927" y="131" fill="#9A4C05">能力边界</text>
    </g>

    <rect x="45" y="160" width="255" height="512" rx="28" fill="#FFFFFF" stroke="#9DB7EB" stroke-width="3"/>
    <rect x="45" y="160" width="255" height="70" rx="28" fill="#EAF1FF"/>
    <path d="M45 200h255v30H45z" fill="#EAF1FF"/>
    <circle cx="82" cy="195" r="12" fill="#2563EB"/>
    <text x="108" y="203" font-size="25" font-weight="760" fill="#1D4ED8">前台入口</text>

    <g filter="url(#shadow)">
      <rect x="76" y="262" width="193" height="72" rx="19" fill="#F0EBFF" stroke="#BDA8F4" stroke-width="2"/>
      <text x="172" y="307" text-anchor="middle" font-size="29" font-weight="780" fill="#5B21B6">/dw-run</text>
    </g>
    <rect x="76" y="365" width="193" height="245" rx="22" fill="#F8FAFF" stroke="#CCD5E1" stroke-width="2"/>
    <rect x="93" y="384" width="159" height="38" rx="18" fill="#2563EB"/>
    <text x="172" y="410" text-anchor="middle" font-size="18" font-weight="760" fill="#FFFFFF">Foreground TUI</text>
    <g font-size="18" font-weight="700">
      <circle cx="103" cy="459" r="7" fill="#2563EB"/><text x="121" y="465">实时阶段与 Agent 进度</text>
      <circle cx="103" cy="500" r="7" fill="#7C3AED"/><text x="121" y="506">近期事件</text>
      <circle cx="103" cy="541" r="7" fill="#D97706"/><text x="121" y="547">Esc 请求取消</text>
      <circle cx="103" cy="582" r="7" fill="#0E7490"/><text x="121" y="588">完成后显示结果卡</text>
    </g>
    <rect x="83" y="627" width="179" height="27" rx="13" fill="#E9F8FC"/>
    <text x="172" y="646" text-anchor="middle" font-size="15" font-weight="700" fill="#0E7490">命令等待结果，不转为后台任务</text>

    <rect x="340" y="160" width="620" height="512" rx="28" fill="#FFFFFF" stroke="#BDA8F4" stroke-width="3"/>
