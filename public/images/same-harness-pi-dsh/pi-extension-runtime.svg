    <text x="410" y="203" font-size="25" font-weight="760" fill="#5B21B6">Extension-owned Runtime</text>
    <rect x="767" y="179" width="158" height="31" rx="15" fill="#7C3AED"/>
    <text x="846" y="201" text-anchor="middle" font-size="15" font-weight="760" fill="#FFFFFF">自定义所有权</text>

    <g filter="url(#shadow)">
      <rect x="443" y="259" width="414" height="78" rx="20" fill="#F0EBFF" stroke="#7C3AED" stroke-width="3"/>
      <text x="650" y="293" text-anchor="middle" font-size="27" font-weight="780" fill="#5B21B6">DynamicWorkflowEngine</text>
      <text x="650" y="320" text-anchor="middle" font-size="17" fill="#6D28D9">调度 saved workflow 的阶段、节点与依赖</text>
    </g>
    <line x1="300" y1="299" x2="431" y2="299" stroke="#2563EB" stroke-width="4" marker-end="url(#arrow-blue)"/>
    <text x="315" y="282" font-size="16" font-weight="700" fill="#1D4ED8">启动并持续等待</text>

    <rect x="379" y="381" width="217" height="104" rx="19" fill="#F8FAFF" stroke="#9DB7EB" stroke-width="2"/>
    <text x="487" y="414" text-anchor="middle" font-size="20" font-weight="760" fill="#1D4ED8">saved workflow script</text>
    <text x="487" y="444" text-anchor="middle" font-size="17" fill="#526079">固定脚本 + 任务输入</text>
    <rect x="405" y="457" width="165" height="22" rx="11" fill="#EAF1FF"/>
    <text x="487" y="473" text-anchor="middle" font-size="14" font-weight="700" fill="#1D4ED8">trusted script boundary</text>

    <rect x="629" y="381" width="290" height="104" rx="19" fill="#FFF0D5" stroke="#F1C77E" stroke-width="2"/>
    <text x="774" y="414" text-anchor="middle" font-size="23" font-weight="780" fill="#9A4C05">Worker + node:vm</text>
    <text x="774" y="444" text-anchor="middle" font-size="17" fill="#7C4A10">解释并运行受信任脚本</text>
    <text x="774" y="472" text-anchor="middle" font-size="15" font-weight="700" fill="#9A4C05">隔离主线程；不是 hostile-code sandbox</text>
    <line x1="650" y1="337" x2="650" y2="367" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrow-purple)"/>
    <line x1="596" y1="433" x2="617" y2="433" stroke="#526079" stroke-width="4" marker-end="url(#arrow-gray)"/>

    <rect x="484" y="535" width="332" height="90" rx="20" fill="#F0EBFF" stroke="#7C3AED" stroke-width="3"/>
    <rect x="510" y="551" width="105" height="31" rx="15" fill="#7C3AED"/>
    <text x="562" y="573" text-anchor="middle" font-size="16" font-weight="760" fill="#FFFFFF">script API</text>
    <text x="650" y="609" text-anchor="middle" font-size="25" font-weight="780" fill="#5B21B6">agent()</text>
    <line x1="774" y1="485" x2="774" y2="521" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrow-purple)"/>
    <text x="792" y="511" font-size="15" font-weight="700" fill="#5B21B6">每个 workflow 节点调用</text>

    <rect x="1000" y="160" width="555" height="512" rx="28" fill="#FFFFFF" stroke="#67C7DA" stroke-width="3"/>
    <rect x="1000" y="160" width="555" height="70" rx="28" fill="#E9F8FC"/>
    <path d="M1000 200h555v30h-555z" fill="#E9F8FC"/>
    <circle cx="1041" cy="195" r="12" fill="#0E7490"/>
    <text x="1070" y="203" font-size="25" font-weight="760" fill="#0E7490">独立子 Pi 进程池</text>
    <rect x="1343" y="179" width="177" height="31" rx="15" fill="#0E7490"/>
    <text x="1431" y="201" text-anchor="middle" font-size="15" font-weight="760" fill="#FFFFFF">复用官方 Loop</text>

    <path d="M816 580H972V289H990" fill="none" stroke="#7C3AED" stroke-width="4" marker-end="url(#arrow-purple)"/>
    <text x="888" y="562" text-anchor="middle" font-size="16" font-weight="700" fill="#5B21B6">每次 agent()</text>
    <text x="888" y="583" text-anchor="middle" font-size="16" font-weight="700" fill="#5B21B6">spawn 1 个进程</text>

    <g filter="url(#shadow)">
      <rect x="1036" y="258" width="483" height="94" rx="20" fill="#F8FAFF" stroke="#9DB7EB" stroke-width="2"/>
      <rect x="1055" y="277" width="76" height="36" rx="18" fill="#2563EB"/><text x="1093" y="302" text-anchor="middle" font-size="16" font-weight="760" fill="#FFFFFF">fast</text>
      <text x="1160" y="288" font-size="16" font-weight="700" fill="#526079">Pi JSON 子进程</text>
      <rect x="1160" y="300" width="328" height="37" rx="16" fill="#E9F8FC" stroke="#67C7DA"/><text x="1324" y="325" text-anchor="middle" font-size="18" font-weight="760" fill="#0E7490">官方 Pi Agent Loop</text>

