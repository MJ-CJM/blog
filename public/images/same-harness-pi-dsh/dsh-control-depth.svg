<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">DSH 从 Stock 到 Full Custom 的控制权阶梯</title>
  <desc id="desc">从左到右展示 DSH 三种实验模式。Stock 使用官方 Agent Loop；Adapter 继承官方 AgentLoop，通过 Profile 替换 AgentFactory，并在原 setup 完成后注入 supervisor、Guard 和回执；Full Custom 自写 Agent Loop，不继承官方 AgentLoop，也不使用官方 ReActLoopAgent，但仍使用官方 WorkflowEngine。三者共享 Session、LLM、Tool、Web 和官方 WorkflowEngine 等平台底座。该图表示控制深度，不代表优劣或成熟度。</desc>
  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#172033" flood-opacity="0.10"/></filter>
    <style>
      .font{font-family:Inter,'Noto Sans SC','PingFang SC',system-ui,sans-serif}.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
      .ink{fill:#172033}.muted{fill:#526079}.white{fill:#FFFFFF}.line{fill:none;stroke-linecap:round;stroke-linejoin:round}
      .body{font-size:19px}.small{font-size:16px}.label{font-size:18px;font-weight:720}
    </style>
  </defs>
  <rect width="1600" height="900" fill="#F7F9FC"/>
  <g class="font ink">
    <text x="800" y="58" text-anchor="middle" font-size="40" font-weight="760">DSH 的控制权可以深入到哪一层？</text>
    <text x="800" y="98" text-anchor="middle" font-size="21" class="muted">同一平台底座上的三种实验：Stock → Adapter → Full Custom</text>

    <path d="M260 130H1340" stroke="#D97706" stroke-width="5" stroke-dasharray="4 11" class="line" marker-end="url(#arrow-orange)"/>
    <rect x="650" y="113" width="300" height="36" rx="18" fill="#FFF0D5"/>
    <text x="800" y="138" text-anchor="middle" font-size="18" font-weight="760" fill="#9A4C05">对 Agent Loop 的控制逐步深入</text>

    <!-- Stock -->
    <g filter="url(#shadow)">
      <rect x="75" y="315" width="440" height="350" rx="28" fill="#FFFFFF" stroke="#BFD2FF" stroke-width="3"/>
      <rect x="75" y="315" width="440" height="82" rx="28" fill="#2563EB"/>
      <path d="M75 365h440v32H75z" fill="#2563EB"/>
      <circle cx="126" cy="356" r="25" fill="#FFFFFF" fill-opacity="0.18"/>
      <text x="126" y="365" text-anchor="middle" font-size="21" font-weight="800" class="white">01</text>
      <text x="171" y="366" font-size="29" font-weight="780" class="white">Stock</text>
      <rect x="351" y="335" width="128" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.18"/>
      <text x="415" y="361" text-anchor="middle" font-size="18" font-weight="720" class="white">控制较浅</text>

      <rect x="119" y="432" width="352" height="64" rx="18" fill="#EAF1FF"/>
      <text x="295" y="473" text-anchor="middle" font-size="24" font-weight="760" fill="#1D4ED8">官方 Agent Loop</text>
      <circle cx="126" cy="539" r="7" fill="#2563EB"/>
      <text x="151" y="547" class="body">使用平台预置循环策略</text>
      <circle cx="126" cy="584" r="7" fill="#2563EB"/>
      <text x="151" y="592" class="body">插件配置 Skill / Tool / Workflow</text>
      <rect x="119" y="620" width="352" height="30" rx="15" fill="#DBE8FF"/>
      <text x="295" y="642" text-anchor="middle" class="small" font-weight="720" fill="#1D4ED8">不改 Agent Loop 的决策骨架</text>
    </g>

    <!-- Adapter -->
    <g filter="url(#shadow)">
      <rect x="580" y="230" width="440" height="435" rx="28" fill="#FFFFFF" stroke="#D8D0F5" stroke-width="3"/>
      <rect x="580" y="230" width="440" height="82" rx="28" fill="#7C3AED"/>
      <path d="M580 280h440v32H580z" fill="#7C3AED"/>
      <circle cx="631" cy="271" r="25" fill="#FFFFFF" fill-opacity="0.18"/>
      <text x="631" y="280" text-anchor="middle" font-size="21" font-weight="800" class="white">02</text>
      <text x="676" y="281" font-size="29" font-weight="780" class="white">Adapter</text>
      <rect x="856" y="250" width="128" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.18"/>
      <text x="920" y="276" text-anchor="middle" font-size="18" font-weight="720" class="white">控制居中</text>

      <rect x="624" y="347" width="352" height="64" rx="18" fill="#F1ECFE"/>
      <text x="800" y="388" text-anchor="middle" font-size="24" font-weight="760" fill="#5B21B6">继承官方 AgentLoop</text>
      <circle cx="631" cy="452" r="7" fill="#7C3AED"/>
      <text x="656" y="460" class="body">Profile 替换 AgentFactory</text>
      <circle cx="631" cy="499" r="7" fill="#7C3AED"/>
      <text x="656" y="507" class="body">setup 后注入监督 / Guard / 回执</text>
      <circle cx="631" cy="546" r="7" fill="#7C3AED"/>
      <text x="656" y="554" class="body">仍由官方 ReActLoopAgent 运行</text>
      <rect x="624" y="590" width="352" height="48" rx="17" fill="#EDE7FC"/>
      <text x="800" y="621" text-anchor="middle" class="label" fill="#5B21B6">换“装配与策略”，不换循环实现</text>
    </g>

    <!-- Full Custom -->
    <g filter="url(#shadow)">
      <rect x="1085" y="145" width="440" height="520" rx="28" fill="#FFFFFF" stroke="#F4D29D" stroke-width="3"/>
      <rect x="1085" y="145" width="440" height="82" rx="28" fill="#D97706"/>
      <path d="M1085 195h440v32h-440z" fill="#D97706"/>
      <circle cx="1136" cy="186" r="25" fill="#FFFFFF" fill-opacity="0.18"/>
      <text x="1136" y="195" text-anchor="middle" font-size="21" font-weight="800" class="white">03</text>
      <text x="1181" y="196" font-size="29" font-weight="780" class="white">Full Custom</text>
      <rect x="1361" y="165" width="128" height="38" rx="19" fill="#FFFFFF" fill-opacity="0.18"/>
      <text x="1425" y="191" text-anchor="middle" font-size="18" font-weight="720" class="white">控制最深</text>

      <rect x="1129" y="262" width="352" height="64" rx="18" fill="#FFF0D5"/>
      <text x="1305" y="303" text-anchor="middle" font-size="24" font-weight="760" fill="#9A4C05">自写 Agent Loop</text>
      <rect x="1129" y="344" width="352" height="48" rx="17" fill="#172033"/>
      <text x="1305" y="375" text-anchor="middle" font-size="18" font-weight="720" class="white mono">Plan → Act → Reflect → Finalize</text>
      <circle cx="1136" cy="432" r="7" fill="#D97706"/>
      <text x="1161" y="440" class="body">不继承官方 AgentLoop</text>
      <circle cx="1136" cy="477" r="7" fill="#D97706"/>
      <text x="1161" y="485" class="body">不使用官方 ReActLoopAgent</text>
      <circle cx="1136" cy="522" r="7" fill="#D97706"/>
      <text x="1161" y="530" class="body">自定预算、阶段与工具调度</text>
      <rect x="1129" y="563" width="352" height="70" rx="18" fill="#E5F6F9" stroke="#A7D8E3" stroke-width="2"/>
      <text x="1305" y="591" text-anchor="middle" class="label" fill="#0E6078">边界仍在平台内</text>
      <text x="1305" y="618" text-anchor="middle" class="body" font-weight="760" fill="#0E6078">继续使用官方 WorkflowEngine</text>
    </g>

    <!-- shared platform base -->
    <path d="M295 665v40M800 665v40M1305 665v40" stroke="#2563EB" stroke-width="4" class="line" marker-end="url(#arrow-blue)"/>
    <g filter="url(#shadow)">
      <rect x="75" y="715" width="1450" height="115" rx="26" fill="#172033"/>
      <text x="130" y="752" font-size="20" font-weight="760" class="white">三种模式共享的 DSH 平台底座</text>
      <g font-size="19" font-weight="720" class="white">
        <rect x="130" y="774" width="210" height="38" rx="19" fill="#2563EB"/><text x="235" y="800" text-anchor="middle">Session</text>
        <rect x="365" y="774" width="210" height="38" rx="19" fill="#7C3AED"/><text x="470" y="800" text-anchor="middle">LLM</text>
        <rect x="600" y="774" width="210" height="38" rx="19" fill="#0E7490"/><text x="705" y="800" text-anchor="middle">Tool</text>
        <rect x="835" y="774" width="210" height="38" rx="19" fill="#2563EB"/><text x="940" y="800" text-anchor="middle">Web / Session UI</text>
        <rect x="1070" y="774" width="400" height="38" rx="19" fill="#D97706"/><text x="1270" y="800" text-anchor="middle">官方 WorkflowEngine</text>
      </g>
    </g>

    <text x="1530" y="875" text-anchor="end" font-size="17" class="muted">控制深度示意；不代表优劣、性能或成熟度排序</text>
  </g>
</svg>
