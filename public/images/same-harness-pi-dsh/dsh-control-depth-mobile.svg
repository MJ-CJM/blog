<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600" role="img" aria-labelledby="title desc">
  <title id="title">DSH 从 Stock 到 Full Custom 的控制权阶梯，手机版</title>
  <desc id="desc">从上到下展示 DSH 三种实验模式。Stock 使用官方 Agent Loop；Adapter 继承官方 AgentLoop，通过 Profile 替换 AgentFactory，并在原 setup 完成后注入 supervisor、Guard 和回执；Full Custom 自写 Agent Loop，不继承官方 AgentLoop，也不使用官方 ReActLoopAgent，但仍使用官方 WorkflowEngine。三者共享 Session、LLM、Tool、Web 和官方 WorkflowEngine 等平台底座。该图表示控制深度，不代表优劣或成熟度。</desc>
  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="140%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#172033" flood-opacity="0.10"/></filter>
    <style>
      .font{font-family:Inter,'Noto Sans SC','PingFang SC',system-ui,sans-serif}.mono{font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace}
      .ink{fill:#172033}.muted{fill:#526079}.white{fill:#FFFFFF}.line{fill:none;stroke-linecap:round;stroke-linejoin:round}
    </style>
  </defs>
  <rect width="900" height="1600" fill="#F7F9FC"/>
  <g class="font ink">
    <text x="450" y="62" text-anchor="middle" font-size="43" font-weight="760">DSH 的控制权</text>
    <text x="450" y="112" text-anchor="middle" font-size="43" font-weight="760">可以深入到哪一层？</text>
    <text x="450" y="154" text-anchor="middle" font-size="25" class="muted">Stock → Adapter → Full Custom</text>
    <rect x="285" y="178" width="330" height="42" rx="21" fill="#FFF0D5"/>
    <text x="450" y="207" text-anchor="middle" font-size="21" font-weight="760" fill="#9A4C05">Agent Loop 控制逐步深入 ↓</text>

    <!-- Stock -->
    <g filter="url(#shadow)">
      <rect x="70" y="245" width="760" height="255" rx="28" fill="#FFFFFF" stroke="#BFD2FF" stroke-width="3"/>
      <rect x="70" y="245" width="190" height="255" rx="28" fill="#2563EB"/>
      <path d="M230 245h30v255h-30z" fill="#2563EB"/>
      <circle cx="165" cy="307" r="30" fill="#FFFFFF" fill-opacity="0.18"/>
      <text x="165" y="317" text-anchor="middle" font-size="24" font-weight="800" class="white">01</text>
      <text x="165" y="365" text-anchor="middle" font-size="31" font-weight="780" class="white">Stock</text>
      <rect x="105" y="405" width="120" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.18"/>
      <text x="165" y="433" text-anchor="middle" font-size="20" font-weight="720" class="white">控制较浅</text>

      <rect x="295" y="277" width="490" height="58" rx="18" fill="#EAF1FF"/>
      <text x="540" y="315" text-anchor="middle" font-size="26" font-weight="760" fill="#1D4ED8">官方 Agent Loop</text>
      <circle cx="310" cy="375" r="7" fill="#2563EB"/>
      <text x="338" y="384" font-size="23">使用平台预置循环策略</text>
      <circle cx="310" cy="421" r="7" fill="#2563EB"/>
      <text x="338" y="430" font-size="23">配置 Skill / Tool / Workflow</text>
      <rect x="295" y="451" width="490" height="34" rx="17" fill="#DBE8FF"/>
      <text x="540" y="475" text-anchor="middle" font-size="20" font-weight="720" fill="#1D4ED8">不改 Agent Loop 的决策骨架</text>
    </g>

    <path d="M450 500v26" stroke="#D97706" stroke-width="5" class="line" marker-end="url(#arrow-orange)"/>

    <!-- Adapter -->
    <g filter="url(#shadow)">
      <rect x="70" y="535" width="760" height="300" rx="28" fill="#FFFFFF" stroke="#D8D0F5" stroke-width="3"/>
      <rect x="70" y="535" width="190" height="300" rx="28" fill="#7C3AED"/>
      <path d="M230 535h30v300h-30z" fill="#7C3AED"/>
      <circle cx="165" cy="600" r="30" fill="#FFFFFF" fill-opacity="0.18"/>
      <text x="165" y="610" text-anchor="middle" font-size="24" font-weight="800" class="white">02</text>
      <text x="165" y="659" text-anchor="middle" font-size="28" font-weight="780" class="white">Adapter</text>
      <rect x="105" y="700" width="120" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.18"/>
      <text x="165" y="728" text-anchor="middle" font-size="20" font-weight="720" class="white">控制居中</text>

      <rect x="295" y="566" width="490" height="58" rx="18" fill="#F1ECFE"/>
      <text x="540" y="604" text-anchor="middle" font-size="26" font-weight="760" fill="#5B21B6">继承官方 AgentLoop</text>
      <circle cx="310" cy="661" r="7" fill="#7C3AED"/>
      <text x="338" y="670" font-size="23">Profile 替换 AgentFactory</text>
      <circle cx="310" cy="705" r="7" fill="#7C3AED"/>
      <text x="338" y="714" font-size="23">setup 后注入监督 / Guard / 回执</text>
      <circle cx="310" cy="749" r="7" fill="#7C3AED"/>
      <text x="338" y="758" font-size="23">仍由官方 ReActLoopAgent 运行</text>
      <rect x="295" y="785" width="490" height="34" rx="17" fill="#EDE7FC"/>
      <text x="540" y="809" text-anchor="middle" font-size="20" font-weight="720" fill="#5B21B6">换“装配与策略”，不换循环实现</text>
    </g>

    <path d="M450 835v26" stroke="#D97706" stroke-width="5" class="line" marker-end="url(#arrow-orange)"/>

    <!-- Full Custom -->
    <g filter="url(#shadow)">
      <rect x="70" y="870" width="760" height="360" rx="28" fill="#FFFFFF" stroke="#F4D29D" stroke-width="3"/>
      <rect x="70" y="870" width="190" height="360" rx="28" fill="#D97706"/>
      <path d="M230 870h30v360h-30z" fill="#D97706"/>
      <circle cx="165" cy="935" r="30" fill="#FFFFFF" fill-opacity="0.18"/>
      <text x="165" y="945" text-anchor="middle" font-size="24" font-weight="800" class="white">03</text>
      <text x="165" y="994" text-anchor="middle" font-size="27" font-weight="780" class="white">Full</text>
      <text x="165" y="1028" text-anchor="middle" font-size="27" font-weight="780" class="white">Custom</text>
      <rect x="105" y="1071" width="120" height="40" rx="20" fill="#FFFFFF" fill-opacity="0.18"/>
      <text x="165" y="1099" text-anchor="middle" font-size="20" font-weight="720" class="white">控制最深</text>

      <rect x="295" y="900" width="490" height="55" rx="18" fill="#FFF0D5"/>
      <text x="540" y="936" text-anchor="middle" font-size="26" font-weight="760" fill="#9A4C05">自写 Agent Loop</text>
      <rect x="295" y="970" width="490" height="42" rx="17" fill="#172033"/>
      <text x="540" y="998" text-anchor="middle" font-size="19" font-weight="720" class="white mono">Plan → Act → Reflect → Finalize</text>
      <circle cx="310" cy="1049" r="7" fill="#D97706"/>
      <text x="338" y="1058" font-size="22">不继承官方 AgentLoop</text>
      <circle cx="310" cy="1092" r="7" fill="#D97706"/>
      <text x="338" y="1101" font-size="22">不使用官方 ReActLoopAgent</text>
      <circle cx="310" cy="1135" r="7" fill="#D97706"/>
      <text x="338" y="1144" font-size="22">自定预算、阶段与工具调度</text>
      <rect x="295" y="1171" width="490" height="44" rx="17" fill="#E5F6F9" stroke="#A7D8E3" stroke-width="2"/>
      <text x="540" y="1200" text-anchor="middle" font-size="20" font-weight="760" fill="#0E6078">仍使用官方 WorkflowEngine</text>
    </g>

    <path d="M450 1230v36" stroke="#2563EB" stroke-width="5" class="line" marker-end="url(#arrow-blue)"/>

    <!-- shared platform base -->
    <g filter="url(#shadow)">
      <rect x="70" y="1275" width="760" height="245" rx="28" fill="#172033"/>
      <text x="450" y="1316" text-anchor="middle" font-size="24" font-weight="760" class="white">三种模式共享的 DSH 平台底座</text>
      <g font-size="21" font-weight="720" class="white">
        <rect x="115" y="1345" width="205" height="48" rx="24" fill="#2563EB"/><text x="218" y="1377" text-anchor="middle">Session</text>
        <rect x="347" y="1345" width="205" height="48" rx="24" fill="#7C3AED"/><text x="450" y="1377" text-anchor="middle">LLM</text>
        <rect x="580" y="1345" width="205" height="48" rx="24" fill="#0E7490"/><text x="683" y="1377" text-anchor="middle">Tool</text>
        <rect x="115" y="1410" width="300" height="48" rx="24" fill="#2563EB"/><text x="265" y="1442" text-anchor="middle">Web / Session UI</text>
        <rect x="440" y="1410" width="345" height="48" rx="24" fill="#D97706"/><text x="613" y="1442" text-anchor="middle">官方 WorkflowEngine</text>
      </g>
      <text x="450" y="1494" text-anchor="middle" font-size="20" fill="#DCE4F2">Full Custom 改写 Agent Loop，但没有替换 WorkflowEngine</text>
    </g>

    <text x="450" y="1574" text-anchor="middle" font-size="21" class="muted">控制深度示意；不代表优劣、性能或成熟度排序</text>
  </g>
</svg>
