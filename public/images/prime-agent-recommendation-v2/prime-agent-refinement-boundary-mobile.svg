<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600" role="img" aria-labelledby="title desc">
  <title id="title">Prime Agent 自我进化的能力边界</title>
  <desc id="desc">Continual Harness 可以调整 Prompt、Memory、Skill 和 Subagent 配置，但不会由 refine 直接训练模型权重、替换基础系统提示或修改 Prime Agent 产品源码。结构化修改经过 review、类型、契约与并发冲突检查，保留历史并可 rollback；配置变化仍需要独立评估。</desc>
  <defs>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#172033" flood-opacity="0.09"/></filter>
  </defs>

  <rect width="900" height="1600" fill="#F7F9FC"/>
  <g font-family="Inter, Noto Sans SC, PingFang SC, system-ui, sans-serif" fill="#172033">
    <text x="450" y="64" text-anchor="middle" font-size="46" font-weight="760">Prime Agent 的“自我进化”</text>
    <text x="450" y="118" text-anchor="middle" font-size="46" font-weight="760">改的是哪一层？</text>
    <text x="450" y="160" text-anchor="middle" font-size="27" fill="#526079">调整 Harness 配置，不训练模型权重</text>

    <rect x="45" y="195" width="810" height="590" rx="32" fill="#FFFFFF" stroke="#F1C77E" stroke-width="3"/>
    <rect x="45" y="195" width="810" height="78" rx="32" fill="#FFF0D5"/>
    <path d="M45 241h810v32H45z" fill="#FFF0D5"/>
    <circle cx="94" cy="234" r="19" fill="#D97706"/>
    <path d="M84 234l7 7 14-17" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="132" y="244" font-size="31" font-weight="760" fill="#9A4C05">可以调整：Harness 配置</text>

    <g filter="url(#shadow)">
      <rect x="80" y="310" width="350" height="190" rx="24" fill="#FFF9EE" stroke="#F1C77E" stroke-width="2"/>
      <circle cx="126" cy="353" r="27" fill="#D97706"/><text x="126" y="362" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">1</text>
      <text x="174" y="364" font-size="31" font-weight="760">Prompt</text>
      <text x="115" y="420" font-size="25" fill="#526079">补充给模型的</text>
      <text x="115" y="455" font-size="25" fill="#526079">行为说明</text>

      <rect x="470" y="310" width="350" height="190" rx="24" fill="#FFF9EE" stroke="#F1C77E" stroke-width="2"/>
      <circle cx="516" cy="353" r="27" fill="#D97706"/><text x="516" y="362" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">2</text>
      <text x="564" y="364" font-size="31" font-weight="760">Memory</text>
      <text x="505" y="420" font-size="25" fill="#526079">记录事实、决策、</text>
      <text x="505" y="455" font-size="25" fill="#526079">失败与偏好</text>

      <rect x="80" y="535" width="350" height="190" rx="24" fill="#FFF9EE" stroke="#F1C77E" stroke-width="2"/>
      <circle cx="126" cy="578" r="27" fill="#D97706"/><text x="126" y="587" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">3</text>
      <text x="174" y="589" font-size="31" font-weight="760">Skill</text>
      <text x="115" y="645" font-size="25" fill="#526079">调整描述、Python 引用</text>
      <text x="115" y="680" font-size="25" fill="#526079">与参数契约</text>

      <rect x="470" y="535" width="350" height="190" rx="24" fill="#FFF9EE" stroke="#F1C77E" stroke-width="2"/>
      <circle cx="516" cy="578" r="27" fill="#D97706"/><text x="516" y="587" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">4</text>
      <text x="564" y="589" font-size="31" font-weight="760">Subagent</text>
      <text x="505" y="645" font-size="25" fill="#526079">调整可复用的分工</text>
      <text x="505" y="680" font-size="25" fill="#526079">与调用时机</text>
    </g>
    <rect x="145" y="741" width="610" height="40" rx="20" fill="#FFE6BA"/>
    <text x="450" y="770" text-anchor="middle" font-size="24" font-weight="700" fill="#9A4C05">默认写当前持久 Session；global 写入需显式请求</text>

    <rect x="45" y="820" width="810" height="350" rx="32" fill="#F1F4F8" stroke="#CCD5E1" stroke-width="3"/>
    <circle cx="94" cy="863" r="22" fill="#526079"/>
    <rect x="82" y="858" width="24" height="19" rx="4" fill="#FFFFFF"/>
    <path d="M87 858v-9a7 7 0 0114 0v9" fill="none" stroke="#FFFFFF" stroke-width="4"/>
    <text x="135" y="874" font-size="31" font-weight="760" fill="#374151">不会由 /refine 直接修改</text>

    <g font-size="26" font-weight="700">
      <rect x="85" y="910" width="730" height="62" rx="18" fill="#FFFFFF" stroke="#CCD5E1"/>
      <circle cx="125" cy="941" r="10" fill="#6B7280"/><text x="158" y="950">基础模型权重</text>
      <rect x="85" y="988" width="730" height="62" rx="18" fill="#FFFFFF" stroke="#CCD5E1"/>
      <circle cx="125" cy="1019" r="10" fill="#6B7280"/><text x="158" y="1028">基础系统提示</text>
      <rect x="85" y="1066" width="730" height="62" rx="18" fill="#FFFFFF" stroke="#CCD5E1"/>
      <circle cx="125" cy="1097" r="10" fill="#6B7280"/><text x="158" y="1106">Prime Agent 产品源码</text>
    </g>
    <rect x="85" y="1138" width="730" height="42" rx="14" fill="#FFF0F0" stroke="#B91C1C" stroke-width="2"/>
    <text x="450" y="1167" text-anchor="middle" font-size="24" font-weight="750" fill="#B91C1C">配置发生变化 ≠ 已证明任务质量提升</text>

    <text x="65" y="1225" font-size="27" font-weight="760" fill="#9A4C05">一次 refinement 的受控路径</text>

    <rect x="65" y="1250" width="340" height="70" rx="18" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="2"/>
    <text x="235" y="1294" text-anchor="middle" font-size="25" font-weight="700">1　历史轨迹</text>
    <rect x="495" y="1250" width="340" height="70" rx="18" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="2"/>
    <text x="665" y="1294" text-anchor="middle" font-size="25" font-weight="700">2　候选 diff</text>
    <line x1="405" y1="1285" x2="483" y2="1285" stroke="#D97706" stroke-width="5" marker-end="url(#arrow-orange)"/>

    <rect x="65" y="1350" width="770" height="82" rx="18" fill="#FFF9EE" stroke="#F1C77E" stroke-width="2"/>
    <text x="450" y="1383" text-anchor="middle" font-size="25" font-weight="700">3　review / 类型 / 契约</text>
    <text x="450" y="1417" text-anchor="middle" font-size="25" font-weight="700">与并发冲突检查</text>
    <path d="M665 1320V1332H450V1338" fill="none" stroke="#D97706" stroke-width="5" marker-end="url(#arrow-orange)"/>

    <rect x="65" y="1470" width="340" height="70" rx="18" fill="#FFFFFF" stroke="#D6DEE9" stroke-width="2"/>
    <text x="235" y="1514" text-anchor="middle" font-size="25" font-weight="700">4　历史与 rollback</text>
    <rect x="495" y="1470" width="340" height="70" rx="18" fill="#FFF0D5" stroke="#D97706" stroke-width="2"/>
    <text x="665" y="1514" text-anchor="middle" font-size="25" font-weight="700" fill="#9A4C05">5　后续运行生效</text>
    <path d="M450 1432V1448H235V1458" fill="none" stroke="#D97706" stroke-width="5" marker-end="url(#arrow-orange)"/>
    <line x1="405" y1="1505" x2="483" y2="1505" stroke="#D97706" stroke-width="5" marker-end="url(#arrow-orange)"/>

    <text x="450" y="1582" text-anchor="middle" font-size="24" fill="#6B7280">概念示意，非性能或时序实测</text>
  </g>
</svg>
