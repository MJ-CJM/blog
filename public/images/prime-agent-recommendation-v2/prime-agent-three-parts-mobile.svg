<svg xmlns="http://www.w3.org/2000/svg" width="900" height="1600" viewBox="0 0 900 1600" role="img" aria-labelledby="title desc">
  <title id="title">RLM、Prime Agent 与 Continual Harness 的关系</title>
  <desc id="desc">RLM 提供操作外部上下文和递归调用语言模型处理子问题的方法。Prime Agent 将持久 IPython、父子 Session、daemon、消息、文件与有界的 best-effort 恢复组合成运行时。运行轨迹可成为 Continual Harness 的配置调整输入；默认写当前持久 Session，global 写入需要显式请求。已应用配置影响后续运行，Prime Agent 当前实现不训练模型权重。</desc>
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#2563EB"/></marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#D97706"/></marker>
    <filter id="shadow" x="-12%" y="-12%" width="124%" height="136%"><feDropShadow dx="0" dy="7" stdDeviation="10" flood-color="#172033" flood-opacity="0.10"/></filter>
  </defs>

  <rect width="900" height="1600" fill="#F7F9FC"/>
  <g font-family="Inter, Noto Sans SC, PingFang SC, system-ui, sans-serif" fill="#172033">
    <text x="450" y="60" text-anchor="middle" font-size="43" font-weight="760">RLM、Prime Agent 与</text>
    <text x="450" y="112" text-anchor="middle" font-size="43" font-weight="760">Continual Harness 是什么关系？</text>
    <text x="450" y="156" text-anchor="middle" font-size="26" fill="#526079">方法、运行时与可迭代配置三层</text>

    <g filter="url(#shadow)">
      <rect x="55" y="190" width="790" height="300" rx="30" fill="#FFFFFF" stroke="#D8D0F5" stroke-width="3"/>
      <rect x="55" y="190" width="790" height="74" rx="30" fill="#7C3AED"/>
      <path d="M55 234h790v30H55z" fill="#7C3AED"/>
      <circle cx="106" cy="226" r="25" fill="#FFFFFF" fill-opacity="0.18"/>
      <text x="106" y="235" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">01</text>
      <text x="152" y="237" font-size="32" font-weight="760" fill="#FFFFFF">RLM：一种方法</text>

      <circle cx="106" cy="311" r="7" fill="#7C3AED"/><text x="137" y="320" font-size="27">把长上下文放到外部环境</text>
      <circle cx="106" cy="361" r="7" fill="#7C3AED"/><text x="137" y="370" font-size="27">用 REPL / 程序按需读取与处理</text>
      <circle cx="106" cy="411" r="7" fill="#7C3AED"/><text x="137" y="420" font-size="27">需要时递归调用 LM 处理子问题</text>
      <rect x="160" y="443" width="580" height="35" rx="18" fill="#F1ECFE"/>
      <text x="450" y="468" text-anchor="middle" font-size="24" font-weight="700" fill="#5B21B6">解决：如何操作超长上下文</text>
    </g>

    <line x1="450" y1="490" x2="450" y2="554" stroke="#2563EB" stroke-width="6" marker-end="url(#arrow-blue)"/>
    <rect x="488" y="504" width="300" height="40" rx="20" fill="#F7F9FC"/>
    <text x="638" y="533" text-anchor="middle" font-size="24" font-weight="700" fill="#1D4ED8">方法被运行时采用</text>

    <g filter="url(#shadow)">
      <rect x="55" y="570" width="790" height="435" rx="30" fill="#FFFFFF" stroke="#BFD2FF" stroke-width="3"/>
      <rect x="55" y="570" width="790" height="78" rx="30" fill="#2563EB"/>
      <path d="M55 616h790v32H55z" fill="#2563EB"/>
      <circle cx="106" cy="608" r="25" fill="#FFFFFF" fill-opacity="0.18"/>
      <text x="106" y="617" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">02</text>
      <text x="152" y="619" font-size="32" font-weight="760" fill="#FFFFFF">Prime Agent：Runtime</text>

      <rect x="120" y="680" width="660" height="55" rx="17" fill="#EAF1FF"/>
      <text x="450" y="716" text-anchor="middle" font-size="27" font-weight="700" fill="#1D4ED8">持久 IPython 工作台</text>
      <rect x="120" y="748" width="660" height="55" rx="17" fill="#EAF1FF"/>
      <text x="450" y="784" text-anchor="middle" font-size="27" font-weight="700" fill="#1D4ED8">父 Session 与 RLM 子 Session</text>
      <rect x="120" y="816" width="660" height="55" rx="17" fill="#EAF1FF"/>
      <text x="450" y="852" text-anchor="middle" font-size="27" font-weight="700" fill="#1D4ED8">daemon、detach 与后台任务</text>
      <rect x="120" y="884" width="660" height="68" rx="17" fill="#EAF1FF"/>
      <text x="450" y="912" text-anchor="middle" font-size="25" font-weight="700" fill="#1D4ED8">消息、文件与有界、</text>
      <text x="450" y="941" text-anchor="middle" font-size="25" font-weight="700" fill="#1D4ED8">best-effort 恢复</text>
      <rect x="170" y="965" width="560" height="30" rx="15" fill="#DBE8FF"/>
      <text x="450" y="988" text-anchor="middle" font-size="24" font-weight="700" fill="#1D4ED8">把方法组合成可运行的产品系统</text>
    </g>

    <line x1="285" y1="1005" x2="285" y2="1097" stroke="#2563EB" stroke-width="6" stroke-dasharray="10 8" marker-end="url(#arrow-blue)"/>
    <rect x="72" y="1023" width="185" height="64" rx="20" fill="#F7F9FC"/>
    <text x="164" y="1051" text-anchor="middle" font-size="24" fill="#1D4ED8">运行轨迹成为</text>
    <text x="164" y="1080" text-anchor="middle" font-size="24" fill="#1D4ED8">配置输入</text>

    <line x1="635" y1="1097" x2="635" y2="1005" stroke="#D97706" stroke-width="6" stroke-dasharray="4 10" stroke-linecap="round" marker-end="url(#arrow-orange)"/>
    <rect x="657" y="1023" width="188" height="64" rx="20" fill="#F7F9FC"/>
    <text x="751" y="1051" text-anchor="middle" font-size="24" fill="#9A4C05">已应用配置</text>
    <text x="751" y="1080" text-anchor="middle" font-size="24" fill="#9A4C05">影响后续运行</text>

    <g filter="url(#shadow)">
      <rect x="55" y="1110" width="790" height="370" rx="30" fill="#FFFFFF" stroke="#F6D9A6" stroke-width="3"/>
      <rect x="55" y="1110" width="790" height="74" rx="30" fill="#D97706"/>
      <path d="M55 1154h790v30H55z" fill="#D97706"/>
      <circle cx="106" cy="1146" r="25" fill="#FFFFFF" fill-opacity="0.18"/>
      <text x="106" y="1155" text-anchor="middle" font-size="24" font-weight="800" fill="#FFFFFF">03</text>
      <text x="152" y="1157" font-size="31" font-weight="760" fill="#FFFFFF">Continual Harness</text>

      <text x="450" y="1226" text-anchor="middle" font-size="27" font-weight="700" fill="#9A4C05">可迭代的作战手册</text>
      <rect x="120" y="1250" width="300" height="48" rx="24" fill="#FFF0D5"/><text x="270" y="1282" text-anchor="middle" font-size="24" font-weight="700" fill="#9A4C05">Prompt</text>
      <rect x="480" y="1250" width="300" height="48" rx="24" fill="#FFF0D5"/><text x="630" y="1282" text-anchor="middle" font-size="24" font-weight="700" fill="#9A4C05">Memory</text>
      <rect x="120" y="1310" width="300" height="48" rx="24" fill="#FFF0D5"/><text x="270" y="1342" text-anchor="middle" font-size="24" font-weight="700" fill="#9A4C05">Skill</text>
      <rect x="480" y="1310" width="300" height="48" rx="24" fill="#FFF0D5"/><text x="630" y="1342" text-anchor="middle" font-size="24" font-weight="700" fill="#9A4C05">Subagent</text>

      <text x="450" y="1395" text-anchor="middle" font-size="25">根据历史轨迹提出配置调整</text>
      <text x="450" y="1428" text-anchor="middle" font-size="25" font-weight="700" fill="#B45309">Prime 当前实现不训练模型权重</text>
      <rect x="130" y="1441" width="640" height="32" rx="16" fill="#FFF0D5"/>
      <text x="450" y="1465" text-anchor="middle" font-size="24" font-weight="700" fill="#9A4C05">默认写当前持久 Session；global 需显式请求</text>
    </g>

    <rect x="70" y="1500" width="760" height="68" rx="22" fill="#172033"/>
    <text x="450" y="1528" text-anchor="middle" font-size="24" font-weight="750" fill="#FFFFFF">RLM 是方法，Prime Agent 是运行时</text>
    <text x="450" y="1558" text-anchor="middle" font-size="24" font-weight="750" fill="#FFFFFF">Continual Harness 是可迭代的作战手册</text>
    <text x="450" y="1592" text-anchor="middle" font-size="24" fill="#6B7280">概念示意，非性能或固定时序实测</text>
  </g>
</svg>
